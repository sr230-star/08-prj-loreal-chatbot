<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Product Advisor</title>
    <meta
      name="description"
      content="L'Oréal Smart Product Advisor — personalized skincare, makeup, haircare, and fragrance routines."
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / L'Oréal Branding ------->
      <header class="site-header">
        <img
          src="img/loreal-logo.png"
          alt="L'Oréal"
          class="brand-logo"
        />
        <div class="brand-divider" aria-hidden="true"></div>
        <h1 class="site-title">Smart Product Advisor</h1>
        <p class="site-subtitle">
          Personalized skincare, makeup, haircare &amp; fragrance guidance
        </p>
      </header>

      <!------- Chat Area ------->
      <main>
        <section class="chatbox" aria-label="L'Oréal Beauty Assistant Chat">
          <div class="chat-toolbar">
            <span class="toolbar-label">Beauty Consultation</span>
            <button
              type="button"
              id="resetChatBtn"
              class="reset-btn"
              title="Start a new conversation"
            >
              New Chat
            </button>
          </div>

          <!-- Latest user question banner (updates on each submitted question) -->
          <div id="latestQuestionBar" class="latest-question hidden">
            <span class="latest-question-label">Latest Question</span>
            <p id="latestQuestionText" class="latest-question-text"></p>
          </div>

          <!-- Conversation bubble history -->
          <div id="chatWindow" class="chat-window" aria-live="polite">
            <!-- messages will be appended here via JS -->
          </div>

          <!-- Suggested starter prompts -->
          <div class="quick-prompts" aria-label="Suggested questions">
            <button
              type="button"
              class="quick-prompt-btn"
              data-prompt="Can you recommend a hydrating L'Oréal skincare routine for dry skin?"
            >
              Hydrating skincare routine
            </button>
            <button
              type="button"
              class="quick-prompt-btn"
              data-prompt="What L'Oréal mascara gives the best volume and length?"
            >
              Best volumizing mascara
            </button>
            <button
              type="button"
              class="quick-prompt-btn"
              data-prompt="Which L'Oréal haircare products help repair heat-damaged hair?"
            >
              Repair damaged hair
            </button>
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about L'Oréal products, routines, or shade advice…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn" aria-label="Send message">
              <span class="material-icons" aria-hidden="true">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2026 L'Oréal Smart Product Advisor. All rights reserved.</p>
        <nav aria-label="Footer links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
